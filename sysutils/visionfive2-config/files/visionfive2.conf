# Loader tunables for the StarFive VisionFive 2, installed by
# sysutils/visionfive2-config into loader.conf.d so that /boot/loader.conf
# remains the administrator's file.

# Run PLL0 at 1500 MHz as the reference platform does, so the
# 375/500/750/1500 MHz operating points are real rather than nominal. Applied
# in jh7110_clk_sys attach with the CPU parked on the oscillator.
# To boot without it: at the loader prompt, "unset hw.jh7110.pll0_boot_hz".
hw.jh7110.pll0_boot_hz="1500000000"

# Bring-up logging on this board overruns the default message buffer long
# before anyone can read it.
kern.msgbufsize="1048576"
